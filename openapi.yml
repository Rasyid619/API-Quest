openapi: 3.0.3
info:
  title: API Quest API
  version: 0.1.0
  description: API Quest assessment service.

tags:
  - name: Echo
    description: Echoes request payloads back to the client.
  - name: Health
    description: Service health checks.

paths:
  /echo:
    post:
      tags:
        - Echo
      summary: Echo the JSON object from the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The same JSON object that was received.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request body is missing or not valid JSON.
  /health:
    get:
      tags:
        - Health
      summary: Check service health.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /ping:
    get:
      tags:
        - Health
      summary: Check whether the service is alive.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
