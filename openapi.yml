openapi: 3.0.3
info:
  title: API Quest API
  version: 0.1.0
  description: API Quest assessment service.

tags:
  - name: Books
    description: Create and read books.
  - name: Echo
    description: Echoes request payloads back to the client.
  - name: Health
    description: Service health checks.

paths:
  /books:
    get:
      tags:
        - Books
      summary: List all books.
      responses:
        "200":
          description: All stored books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      tags:
        - Books
      summary: Create a book.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookRequest"
      responses:
        "201":
          description: The created book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: The request body failed validation.
  /books/{id}:
    get:
      tags:
        - Books
      summary: Get a single book by id.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID identifying the book.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: The id is not a valid UUID.
        "404":
          description: No book has the given id.
  /echo:
    post:
      tags:
        - Echo
      summary: Echo the JSON object from the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The same JSON object that was received.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request body is missing or not valid JSON.
  /health:
    get:
      tags:
        - Health
      summary: Check service health.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /ping:
    get:
      tags:
        - Health
      summary: Check whether the service is alive.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the book.
        title:
          type: string
          description: Title of the book.
        author:
          type: string
          description: Author of the book.
        year:
          type: integer
          description: Publication year of the book.
      required:
        - id
        - title
        - author
        - year
    CreateBookRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the book.
        author:
          type: string
          description: Author of the book.
        year:
          type: integer
          description: Publication year of the book.
      required:
        - title
        - author
        - year
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
