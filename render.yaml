services:
  - type: web
    name: api-quest
    runtime: node
    plan: free
    buildCommand: corepack yarn install --immutable && corepack yarn build
    startCommand: node --enable-source-maps ./dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: PORT
        value: 10000
