services:
  - type: web
    name: api-quest
    runtime: node
    plan: free
    buildCommand: corepack yarn install --immutable && corepack yarn build
    startCommand: corepack yarn migrate up && node --enable-source-maps ./dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: PORT
        value: 10000
      # Set to your Render Postgres Internal Database URL in the dashboard.
      - key: DATABASE_URL
        sync: false
      # HS256 secret used to sign and verify access tokens; auto-generated by Render.
      - key: ACCESS_TOKEN_PUBLIC_KEY
        generateValue: true
      # Username accepted by POST /auth/token; set in the dashboard.
      - key: AUTH_USERNAME
        sync: false
      # Password accepted by POST /auth/token; set in the dashboard.
      - key: AUTH_PASSWORD
        sync: false
